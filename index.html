<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>cubing</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family:
                Arial,
                sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }
        h1 {
            margin-bottom: 30px;
        }
        #connect {
            width: 200px;
            height: 50px;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        #buttons {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(4, 90px);
            gap: 10px;
            justify-content: center;
        }
        #buttons button {
            position: relative;
            width: 90px;
            height: 90px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition:
                transform 0.05s,
                background 0.1s;
        }
        #buttons button:active {
            transform: scale(0.92);
            background: #666;
        }
        .note {
            position: absolute;
            right: 8px;
            bottom: 5px;
            font-size: 14px;
            font-weight: normal;
            opacity: 0.7;
        }
        #current {
            margin-top: 40px;
            font-size: 60px;
            font-weight: bold;
            min-height: 70px;
        }
    </style>
</head>

<body>
    <button id="connect">接続</button>
    <select id="preset"></select>
    <br>
    <div id="buttons"></div>
    <div id="current">-</div>
    <script type="module" src="./main.js" ></script>
</body>

</html>
